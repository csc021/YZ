server:
  port: 8080
  servlet:
    context-path: /station/v1
spring:
  profiles:
    active: dev
  security:
    user:
      name: admin
      password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.tf.sc.entity

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
